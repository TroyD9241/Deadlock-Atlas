# Postgres for local development.
#
#   docker compose up -d
#
# Then point DATABASE_URL in .env at the URL below and run `npm run db:migrate`.
#
# Note the host port is 5433, not the Postgres default 5432. A Postgres running
# under WSL is already bound to 127.0.0.1:5432 on this machine, and the WSL relay
# shadows Docker's published port on loopback, so 5432 reaches the wrong server.
# Change both this file and .env together if you move it.
#
# Note: Prisma Studio could not open the SQLite database used before this
# switch, because Prisma 7 rejects the `file:` protocol. That is why this is
# Postgres rather than SQLite.

services:
  db:
    image: postgres:17-alpine
    container_name: deadlock-atlas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: deadlock_atlas
    ports:
      - "5433:5432"
    volumes:
      - atlas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d deadlock_atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atlas-pgdata: